name: Validar snippets

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar estructura de los .snippet
        run: python3 tools/validate_snippets.py

      - name: Verificar que SNIPPETS.md este al dia
        run: python3 tools/generate_index.py --check

      - name: Analizar Install-Snippets.ps1
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path tools/Install-Snippets.ps1 -Severity Error
          if ($issues) {
            $issues | Format-Table -AutoSize
            exit 1
          }
          Write-Host 'Sin errores de PSScriptAnalyzer.'
